name: Windows Packaging

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,build,test]"

      - name: Run automated tests
        run: python -m pytest -q

      - name: Build portable Windows bundle
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          .\dist\ROSTER\ROSTER.exe --list-providers
          if ($LASTEXITCODE -ne 0) { throw "Packaged provider-list smoke test failed." }
          .\dist\ROSTER\ROSTER.exe --doctor
          if ($LASTEXITCODE -ne 0) { throw "Packaged diagnostics smoke test failed." }

      - name: Archive portable bundle
        shell: pwsh
        run: Compress-Archive -Path dist\ROSTER\* -DestinationPath ROSTER-Windows-portable.zip -Force

      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: ROSTER-Windows-portable
          path: ROSTER-Windows-portable.zip
          if-no-files-found: error
          retention-days: 14
